global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: shardkv
    static_configs:
      - targets:
          - node1:10081
          - node2:10082
          - node3:10083
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: node
        replacement: '$1'

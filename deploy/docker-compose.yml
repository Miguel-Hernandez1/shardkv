services:

  node1:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      SHARDKV_NODE_ID: node1
      SHARDKV_RAFT_ADDR: node1:9081
      SHARDKV_HTTP_ADDR: :8081
      SHARDKV_METRICS_ADDR: :10081
      SHARDKV_DATA_DIR: /data/node1
      SHARDKV_PEERS: node1:9081,node2:9082,node3:9083
      SHARDKV_NUM_SHARDS: "3"
      SHARDKV_BOOTSTRAP: "true"
    ports:
      - "8081:8081"
      - "9081:9081"   # shard 0
      - "9181:9181"   # shard 1
      - "9281:9281"   # shard 2
      - "10081:10081"
    volumes:
      - node1-data:/data/node1
    networks:
      - shardkv-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/v1/status"]
      interval: 5s
      timeout: 3s
      retries: 12

  node2:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      SHARDKV_NODE_ID: node2
      SHARDKV_RAFT_ADDR: node2:9082
      SHARDKV_HTTP_ADDR: :8082
      SHARDKV_METRICS_ADDR: :10082
      SHARDKV_DATA_DIR: /data/node2
      SHARDKV_PEERS: node1:9081,node2:9082,node3:9083
      SHARDKV_NUM_SHARDS: "3"
      SHARDKV_BOOTSTRAP: "false"
    ports:
      - "8082:8082"
      - "9082:9082"   # shard 0
      - "9182:9182"   # shard 1
      - "9282:9282"   # shard 2
      - "10082:10082"
    volumes:
      - node2-data:/data/node2
    networks:
      - shardkv-net
    depends_on:
      node1:
        condition: service_healthy

  node3:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      SHARDKV_NODE_ID: node3
      SHARDKV_RAFT_ADDR: node3:9083
      SHARDKV_HTTP_ADDR: :8083
      SHARDKV_METRICS_ADDR: :10083
      SHARDKV_DATA_DIR: /data/node3
      SHARDKV_PEERS: node1:9081,node2:9082,node3:9083
      SHARDKV_NUM_SHARDS: "3"
      SHARDKV_BOOTSTRAP: "false"
    ports:
      - "8083:8083"
      - "9083:9083"   # shard 0
      - "9183:9183"   # shard 1
      - "9283:9283"   # shard 2
      - "10083:10083"
    volumes:
      - node3-data:/data/node3
    networks:
      - shardkv-net
    depends_on:
      node1:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - shardkv-net

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - shardkv-net
    depends_on:
      - prometheus

volumes:
  node1-data:
  node2-data:
  node3-data:

networks:
  shardkv-net:
    driver: bridge
